<title>Watergram 메인화면</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
    /* 기본 스타일 초기화 */
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f0f0f0; /* 전체 배경색 (이미지의 밝은 회색 부분) */
        color: #333;
        display: flex;
        min-height: 100vh;
    }

    /* 전체 컨테이너 (좌측 네비게이션과 메인 콘텐츠를 포함) */
    .container {
        display: flex;
        width: 100%;
        background-color: #121212; /* 이미지의 주 배경색 (어두운 검정) */
    }

    /* 좌측 네비게이션 바 스타일 */
    .nav-bar {
        width: 80px;
        padding: 20px 0;
        background-color: #000; /* 네비게이션 바 배경색 */
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .nav-item {
        color: #fff;
        text-align: center;
        margin-bottom: 30px;
        cursor: pointer;
        transition: color 0.2s;
    }

    .nav-item:hover {
        color: #9933ff; /* 호버 시 색상 변경 예시 */
    }

    /* 아이콘 색상 및 크기 */
    .nav-item i {
        font-size: 24px;
        margin-bottom: 5px;
    }

    /* 홈 아이콘만 이미지에 맞게 색상 변경 */
    .nav-item.home i {
        color: #fff;
    }
    .nav-item.search i {
        color: #8a2be2; /* 보라색 계열 */
    }
    .nav-item.message i {
        color: #9933ff; /* 보라색 계열 */
    }
    .nav-item.heart i {
        color: #ff69b4; /* 분홍색 계열 */
    }
    .nav-item.profile i {
        color: #1e90ff; /* 파란색 계열 */
    }

    /* 메인 콘텐츠 영역 스타일 */
    .main-content {
        flex-grow: 1;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* 메인 제목 Watergram 스타일 */
    .app-header {
        color: white;
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    /* 메인 레이아웃 (피드 영역과 추천 팔로우 영역) */
    .content-area {
        display: flex;
        justify-content: center;
        width: 100%;
        max-width: 1200px; /* 전체 너비 제한 */
    }

    /* 중앙 피드 및 포스팅 영역 */
    .feed-container {
        width: 65%; /* 비율 조정 */
        max-width: 600px;
        margin-right: 30px;
    }

    /* 우측 추천 팔로우 영역 */
    .sidebar {
        width: 35%; /* 비율 조정 */
        max-width: 300px;
        margin-top: 10px; /* 제목/로그아웃 섹션과 맞추기 위해 약간 내림 */
    }

    /* --- 포스팅 박스 스타일 --- */
    .post-input-box {
        background-color: #444; /* 포스팅 배경색 */
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 8px;
        color: white;
    }

    .post-input-box input[type="text"] {
        width: calc(100% - 80px); /* 버튼 공간 제외 */
        padding: 10px;
        margin-bottom: 10px;
        border: none;
        background-color: #333;
        color: white;
        border-radius: 4px;
    }

    .post-input-box button {
        padding: 8px 15px;
        background-color: #1e90ff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        float: right;
    }

    /* --- 개별 게시물 스타일 --- */
    .post-card {
        background-color: #444; /* 게시물 배경색 */
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 8px;
        color: white;
    }

    .post-user {
        font-weight: bold;
        margin-bottom: 10px;
    }

    .post-image {
        width: 100%;
        height: 300px; /* 이미지 영역 높이 */
        background-color: #ff69b480; /* 이미지 영역을 빨간색 계열로 표시 */
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 10px;
        border-radius: 4px;
        font-size: 18px;
    }

    .post-body {
        margin-bottom: 10px;
    }

    .post-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .post-footer button {
        background: none;
        border: none;
        color: white;
        cursor: pointer;
    }

    .post-footer .like-btn {
        color: #ff69b4; /* Like 버튼 색상 */
    }

    /* --- 우측 사이드바 스타일 --- */
    .sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        color: white;
        font-size: 14px;
    }

    .sidebar-header button {
        background: none;
        border: none;
        color: #aaa;
        cursor: pointer;
        font-size: 14px;
    }

    .follow-list {
        background-color: #444; /* 추천 팔로우 박스 배경색 */
        height: 300px; /* 높이 지정 */
        border-radius: 8px;
    }
</style>
</head>
<body>

<div class="container">

    <div class="nav-bar">
        <div class="nav-item home">
            <i class="fas fa-home"></i>
            <div>홈</div>
        </div>
        <div class="nav-item search">
            <i class="fas fa-search"></i>
            <div>검색</div>
        </div>
        <div class="nav-item message">
            <i class="fas fa-paper-plane"></i>
            <div>메시지</div>
        </div>
        <div class="nav-item heart">
            <i class="fas fa-heart"></i>
            <div>알림</div>
        </div>
        <div class="nav-item profile">
            <i class="fas fa-user-circle"></i>
            <div>프로필</div>
        </div>
    </div>

    <div class="main-content">
        <div style="color:white; font-size:16px; margin-bottom: 10px;">메인화면</div>
        <div class="app-header">Watergram</div>

        <div class="content-area">

            <div class="feed-container">

                <div class="post-input-box">
                    <input type="text" placeholder="제목">
                    <div style="overflow: hidden;">
                        <input type="text" placeholder="작성할 내용" style="width: 100%; margin-bottom: 0;">
                        <button>작성하기</button>
                    </div>
                </div>

                <div class="post-card">
                    <div class="post-user">사용자명(본인 혹은 친구)</div>
                    <div class="post-image">사진 노출 영역</div>
                    <div class="post-body">게시글 본문</div>
                    <div class="post-footer">
                        <button>댓글</button>
                        <button class="like-btn">Like <i class="fas fa-heart"></i></button>
                    </div>
                </div>

            </div>

            <div class="sidebar">
                <div class="sidebar-header">
                    <div>사용자명(본인)</div>
                    <button>로그아웃</button>
                </div>
                <div class="sidebar-header" style="margin-top: 20px; font-weight: bold;">
                    추천 팔로우
                </div>
                <div class="follow-list">
                </div>
            </div>
        </div>
    </div>
</div>

</html>
